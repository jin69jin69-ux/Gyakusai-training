<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆算トレーニング</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1D24">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="逆算トレ">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

  :root{
    --bg:#EFEDE7; --card:#FFFFFF; --ink:#22252B; --ink-soft:#6B6E76; --line:#DCD8CC;
    --board:#1A1D24; --amber:#FF9F1C; --teal:#3EC1B3; --danger:#E1553D; --purple:#8E7CC3;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Zen Kaku Gothic New', sans-serif; -webkit-font-smoothing:antialiased; }
  .app{ max-width:440px; margin:0 auto; padding:28px 18px 60px; }
  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; color:var(--ink-soft); text-transform:uppercase; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
  .eyebrow .link{ color:var(--purple); cursor:pointer; text-decoration:underline; letter-spacing:0; text-transform:none; font-family:'Zen Kaku Gothic New', sans-serif; font-size:12px; }
  h1{ font-size:26px; font-weight:900; margin:0 0 6px; letter-spacing:.01em; }
  .sub{ font-size:13.5px; color:var(--ink-soft); margin:0 0 26px; line-height:1.6; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 20px; margin-bottom:14px; }
  .q-label{ font-size:15px; font-weight:700; margin-bottom:14px; line-height:1.5; }
  .q-hint{ font-size:12.5px; color:var(--ink-soft); margin:-8px 0 16px; }

  input[type="text"], input[type="time"]{
    width:100%; font-family:'Zen Kaku Gothic New', sans-serif; font-size:16px;
    padding:12px 14px; border-radius:9px; border:1px solid var(--line); background:#FBFAF7; color:var(--ink);
  }
  input[type="time"]{ font-family:'JetBrains Mono', monospace; font-weight:700; letter-spacing:.03em; }
  label.field-label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }

  .stepper{ background:#FBFAF7; border:1px solid var(--line); border-radius:9px; padding:14px; }
  .stepper-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .stepper-row button{ width:38px; height:38px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-size:18px; font-weight:700; cursor:pointer; }
  .stepper-row button:active{ transform:scale(0.94); }
  .min-input{
    width:88px; text-align:center; font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700;
    padding:8px 4px; border-radius:9px; border:1px solid var(--line); background:#fff; color:var(--ink);
  }
  .min-suffix{ font-size:12px; color:var(--ink-soft); }
  .stepper-caption{ text-align:center; font-size:10.5px; color:var(--ink-soft); margin-top:10px; letter-spacing:.02em; }

  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn{ flex:1; font-family:'Zen Kaku Gothic New', sans-serif; font-size:14.5px; font-weight:700; padding:13px 10px; border-radius:9px; border:none; cursor:pointer; }
  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:disabled{ background:#C9C6BC; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); flex:0 0 auto; padding:13px 16px; }

  .progress{ display:flex; gap:6px; margin-bottom:18px; }
  .progress i{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .progress i.done{ background:var(--teal); }
  .progress i.now{ background:var(--amber); }

  /* Mode select */
  .mode-card{ display:flex; align-items:center; gap:14px; padding:20px; border-radius:14px; border:1px solid var(--line); background:var(--card); margin-bottom:12px; cursor:pointer; text-align:left; width:100%; }
  .mode-card .icon{ width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 auto; }
  .mode-card.practice .icon{ background:#FFE9CC; }
  .mode-card.sim .icon{ background:#E4E0F4; }
  .mode-card .txt b{ display:block; font-size:15px; margin-bottom:3px; }
  .mode-card .txt span{ font-size:12px; color:var(--ink-soft); line-height:1.5; }

  .friend-link{ display:block; text-align:center; font-size:13px; color:var(--ink-soft); text-decoration:underline; margin-top:6px; cursor:pointer; background:none; border:none; width:100%; padding:10px; }

  /* Friends */
  .friend-row{ display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); }
  .friend-row:last-child{ border-bottom:none; }
  .friend-row .name{ flex:1; font-size:14px; }
  .friend-row button{ border:none; background:none; color:var(--danger); font-size:13px; cursor:pointer; }
  .add-friend-row{ display:flex; gap:8px; margin-top:14px; }
  .add-friend-row input{ flex:1; }
  .add-friend-row button{ flex:0 0 auto; padding:0 16px; border-radius:9px; border:none; background:var(--ink); color:#fff; font-weight:700; cursor:pointer; }
  .empty-note{ font-size:12.5px; color:var(--ink-soft); text-align:center; padding:14px 0; }

  /* Scenario card */
  .scenario-tag{ display:inline-block; font-family:'JetBrains Mono', monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--purple); padding:4px 9px; border-radius:6px; margin-bottom:12px; }
  .scenario-text{ font-size:16px; font-weight:700; line-height:1.6; margin-bottom:6px; }
  .scenario-time{ font-family:'JetBrains Mono', monospace; font-size:28px; font-weight:700; color:var(--purple); margin:10px 0 4px; }
  .solved-count{ font-size:11.5px; color:var(--ink-soft); }

  /* Board */
  .board{ background:var(--board); border-radius:16px; padding:20px 16px 16px; color:#EDEEF0; }
  .board-head{ display:flex; justify-content:space-between; align-items:center; padding:0 4px 14px; border-bottom:1px solid #333744; margin-bottom:8px; }
  .board-head .title{ font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; color:#9A9DA6; text-transform:uppercase; }
  .board-head .now-wrap{ display:flex; align-items:center; gap:10px; }
  .board-head .now{ font-family:'JetBrains Mono', monospace; font-size:13px; color:var(--teal); font-weight:700; }
  .sound-toggle{ width:30px; height:30px; border-radius:50%; border:1px solid #3A3E49; background:#22262f; color:#EDEEF0; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .sound-toggle.off{ color:#5C6270; }
  .bgm-hint{ font-size:12px; color:var(--ink-soft); line-height:1.6; margin-top:10px; }
  .bgm-status{ font-size:12.5px; color:var(--teal); margin-top:10px; }

  .row{ display:flex; align-items:center; gap:12px; padding:14px 6px; border-bottom:1px solid #2A2E38; }
  .row:last-child{ border-bottom:none; }
  .row .time{ font-family:'JetBrains Mono', monospace; font-size:22px; font-weight:700; color:var(--amber); min-width:74px; letter-spacing:.02em; }
  .row .label{ flex:1; font-size:14px; line-height:1.4; }
  .row .label .sub{ display:block; font-size:11.5px; color:#8C8F99; margin:2px 0 0; }
  .row.next{ background:#22262f; border-radius:8px; }
  .row.next .time{ animation:pulse 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .row.next .time{ animation:none; } }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.45; } }
  .row.overdue .time{ color:var(--danger); }
  .row.manual-done{ opacity:.55; }
  .row.manual-done .time{ color:#5C6270; text-decoration:line-through; }
  .row.manual-done .label{ color:#6B6F79; }
  .check-btn{ width:34px; height:34px; border-radius:50%; border:1.5px solid #454956; background:transparent; color:#454956; font-size:16px; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .check-btn.checked{ background:var(--teal); border-color:var(--teal); color:#12151a; }
  .board-foot{ margin-top:14px; padding-top:12px; border-top:1px solid #333744; font-size:12.5px; color:#9A9DA6; line-height:1.6; }
  .result-actions{ display:flex; gap:10px; margin-top:16px; }

  /* Room */
  .room-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .room-canvas{
    position:relative; width:100%; height:0; padding-bottom:73.3%; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); background:#EFEDE7;
  }
  .room-diorama{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .room-mascot{ position:absolute; left:50%; bottom:3%; width:19%; transform:translateX(-50%); filter:drop-shadow(0 6px 4px rgba(0,0,0,0.15)); z-index:5; }
  .room-mascot .mascot-avatar{ width:100%; height:auto; animation:none; }
  .room-placed{
    position:absolute; font-size:28px; line-height:1; cursor:grab; user-select:none; touch-action:none;
    transform:translate(-50%,-50%); filter:drop-shadow(0 3px 2px rgba(0,0,0,0.2)); z-index:4;
  }
  .room-placed.dragging{ cursor:grabbing; filter:drop-shadow(0 6px 5px rgba(0,0,0,0.26)); z-index:20; }
  .room-hint{ text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:8px; }
  .room-tray-label{ font-size:12px; font-weight:700; margin:16px 0 8px; color:var(--ink-soft); }
  .room-tray{ display:flex; flex-wrap:wrap; gap:9px; }
  .room-item{
    width:38px; height:38px; border-radius:10px; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:19px; cursor:pointer;
  }
  .room-item.locked{ opacity:.32; filter:grayscale(1); background:#F2F0EA; cursor:default; }
  .room-progress-note{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-top:12px; }

  /* Gallery */
  .gallery-grid{ display:grid; grid-template-columns:repeat(4, 1fr); gap:9px; }
  .gallery-item{
    aspect-ratio:1; border-radius:11px; background:var(--card); border:1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:4px;
  }
  .gallery-item .emoji{ font-size:22px; }
  .gallery-item .label{ font-size:8.5px; color:var(--ink-soft); text-align:center; line-height:1.2; }
  .gallery-item.locked{ opacity:.4; }
  .gallery-item.locked .emoji{ filter:grayscale(1); }
  .gallery-summary{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }


  /* Mascot */
  .mascot-bar{ display:flex; align-items:flex-end; gap:12px; margin-bottom:20px; }
  .mascot-avatar{ width:64px; height:auto; flex:0 0 auto; animation:mascotFloat 3.2s ease-in-out infinite; display:block; }
  @media (prefers-reduced-motion: reduce){ .mascot-avatar{ animation:none; } }
  @keyframes mascotFloat{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-4px); } }
  .mascot-avatar.celebrate{ animation:mascotBounce .6s ease; }
  @media (prefers-reduced-motion: reduce){ .mascot-avatar.celebrate{ animation:none; } }
  @keyframes mascotBounce{ 0%{ transform:scale(1); } 30%{ transform:scale(1.18) rotate(-4deg); } 60%{ transform:scale(0.95) rotate(3deg); } 100%{ transform:scale(1) rotate(0); } }
  .speech-bubble{
    position:relative; background:var(--card); border:1px solid var(--line); border-radius:14px 14px 14px 3px;
    padding:10px 14px; font-size:12.5px; line-height:1.6; flex:1; min-height:1.6em;
    transition:opacity .2s ease;
  }
  .speech-bubble b{ display:block; font-size:11px; color:var(--purple); margin-bottom:2px; }

</style>
</head>

  function toMinutes(hhmm){ const [h,m] = hhmm.split(':').map(Number); return h*60+m; }
  function toHHMM(totalMin){
    let t = ((totalMin % 1440) + 1440) % 1440;
    const h = Math.floor(t/60).toString().padStart(2,'0');
    const m = (t%60).toString().padStart(2,'0');
    return `${h}:${m}`;
  }
  function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
  function todayStr(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  // --- sound ---
  let audioCtx = null;
  function ctx(){ if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
  function playTone(freqs, dur=0.14, gap=0.09){
    if(!state.soundOn) return;
    const ac = ctx(); let t = ac.currentTime;
    freqs.forEach(f=>{
      const osc = ac.createOscillator(); const gain = ac.createGain();
      osc.type = 'sine'; osc.frequency.value = f;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(ac.destination);
      osc.start(t); osc.stop(t + dur + 0.02);
      t += gap;
    });
  }
  function playComplete(){ playTone([660, 880, 1100]); }
  function playAlert(){ playTone([520, 520], 0.16, 0.2); }
  function playWin(){ playTone([660, 880, 1100, 1320], 0.15, 0.11); }

  // --- YouTube BGM ---
  function getYouTubeId(url){
    if(!url) return null;
    const m = url.match(/(?:youtu\.be\/|[?&]v=|embed\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  let ytPlayer = null;
  let ytReady = false;
  window.onYouTubeIframeAPIReady = function(){ ytReady = true; };
  (function loadYT(){
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  })();
  function ensurePlayer(videoId, cb){
    if(!window.YT || !ytReady){ setTimeout(()=>ensurePlayer(videoId, cb), 300); return; }
    if(!ytPlayer){
      ytPlayer = new YT.Player('ytPlayer', {
        height:'0', width:'0', videoId: videoId,
        playerVars:{ autoplay:1, controls:0 },
        events:{ onReady: ()=>{ cb && cb(); } }
      });
    } else {
      ytPlayer.loadVideoById(videoId);
      cb && cb();
    }
  }
  function playBGM(){
    const id = getYouTubeId(state.bgmUrl);
    if(!id) return;
    ensurePlayer(id, ()=>{ try{ ytPlayer.playVideo(); }catch(e){} });
    state.bgmPlaying = true;
  }
  function pauseBGM(){ if(ytPlayer){ try{ ytPlayer.pauseVideo(); }catch(e){} } state.bgmPlaying = false; }
  function stopBGM(){ if(ytPlayer){ try{ ytPlayer.stopVideo(); }catch(e){} } state.bgmPlaying = false; }

    if(opts && opts.celebrate){

      av.classList.remove('celebrate');

    }

    try{ const m = await window.storage.get('mascot-met-' + state.mascotId); met = !!(m && m.value); }catch(e){ met = false; }
    if(!met){
      mascotSay(currentMascot().intro);
      try{ await window.storage.set('mascot-met-' + state.mascotId, 'true'); }catch(e){}
      return;
    }
    const h = new Date().getHours();
    if(h >= 5 && h < 11) mascotSayCat('greetMorning');
    else if(h >= 11 && h < 17) mascotSayCat('greetAfternoon');
    else if(h >= 17 && h < 23) mascotSayCat('greetEvening');
    else mascotSayCat('greetNight');

  // --- Room / decorations (free placement, drag to move) ---
  function roomToPercent(canvasEl, clientX, clientY){
    const rect = canvasEl.getBoundingClientRect();
    let x = (clientX - rect.left) / rect.width * 100;
    let y = (clientY - rect.top) / rect.height * 100;
    x = Math.max(10, Math.min(90, x));
    y = Math.max(48, Math.min(92, y));
    return {x, y};
  }
  function makeDraggable(el, id){
    let dragging = false, moved = false, startX = 0, startY = 0;
    const canvasEl = document.getElementById('roomCanvas');
    el.addEventListener('pointerdown', (e)=>{
      dragging = true; moved = false;
      startX = e.clientX; startY = e.clientY;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
    });
    el.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      if(Math.abs(e.clientX - startX) > 4 || Math.abs(e.clientY - startY) > 4) moved = true;
      if(moved){
        const p = roomToPercent(canvasEl, e.clientX, e.clientY);
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
        state.roomLayout[id] = p;
        el.classList.add('dragging');
      }
    });
    function finish(){
      if(!dragging) return;
      dragging = false;
      el.classList.remove('dragging');
      if(moved){
        saveRoomLayout();
      } else {
        delete state.roomLayout[id];
        saveRoomLayout();
        renderRoom();
      }
    }
    el.addEventListener('pointerup', finish);
    el.addEventListener('pointercancel', finish);
  }

              <line x1="72" y1="146" x2="150" y2="164"/>
              <line x1="98" y1="163" x2="150" y2="182"/>
              <line x1="124" y1="180" x2="150" y2="198"/>
              <line x1="228" y1="146" x2="150" y2="164"/>
              <line x1="202" y1="163" x2="150" y2="182"/>
              <line x1="176" y1="180" x2="150" y2="198"/>
            </g>
          </svg>
          <div class="room-mascot">${avatarSvg}</div>
          ${placedHtml}
        </div>
        <div class="room-hint">アイテムをタップで配置、ドラッグで移動、もう一度タップでしまえます。</div>
        <div class="room-tray-label">持ちもの（${state.unlockedDecor.length} / ${decorPool.length} 個 集めた）</div>
        <div class="room-tray">${trayHtml}</div>
        <div class="room-progress-note">予定を達成すると、アイテムがひとつ増えます。</div>
      </div>
      <div class="btn-row"><button class="btn btn-ghost" id="back">ホームに戻る</button></div>
    `;
    placedIds.forEach(id=>{
      const el = document.getElementById('placed-' + id);
      if(el) makeDraggable(el, id);
    });
    document.querySelectorAll('.room-item[data-id]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const id = chip.dataset.id;
        if(!state.unlockedDecor.includes(id)) return;
        state.roomLayout[id] = { x: 20 + Math.random()*60, y: 55 + Math.random()*30 };
        saveRoomLayout();
        renderRoom();
      });
    });
    document.getElementById('back').addEventListener('click', ()=>{ state.screen='home'; render(); });
  }

  // --- Gallery: full item list ---
  function renderGallery(){
    const gotCount = state.unlockedDecor.length;
    const itemsHtml = decorPool.map(d=>{
      const got = state.unlockedDecor.includes(d.id);
      return `<div class="gallery-item ${got?'':'locked'}">
        <div class="emoji">${got ? d.emoji : '❔'}</div>
        <div class="label">${got ? d.name : '？？？'}</div>
      </div>`;
    }).join('');
    wizard.innerHTML = `
      <div class="gallery-summary">${gotCount} / ${decorPool.length} 種類 集めた</div>
      <div class="gallery-grid">${itemsHtml}</div>
      <div class="btn-row" style="margin-top:16px;"><button class="btn btn-ghost" id="back">ホームに戻る</button></div>
    `;
    document.getElementById('back').addEventListener('click', ()=>{ state.screen='home'; render(); });
  }

  // --- Practice: goal input ---
  function renderGoal(){
    if(!state.goalDate) state.goalDate = todayStr();
    wizard.innerHTML = `
      <div class="card">
        <div class="q-label">いつの、どんな予定に間に合わせたいですか？</div>
        <label class="field-label">日付</label>
        <input type="date" id="goalDate" value="${state.goalDate}" min="${todayStr()}" style="margin-bottom:14px;">
        <label class="field-label">予定の名前</label>
        <input type="text" id="eventName" placeholder="例：出勤／登園受け入れ" value="${state.eventName}" style="margin-bottom:14px;">
        <label class="field-label">その時刻までに着いていたい時刻</label>
        <input type="time" id="goalTime" value="${state.goalTime}">
        <div class="q-hint" style="margin-top:10px;">前日の夜に明日の予定を入力しておけば、翌朝アプリを開いたときに計画が残っています。</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="back">ホームに戻る</button>
          <button class="btn btn-primary" id="next" disabled>次へ</button>
        </div>
      </div>
    `;
    const dateEl = document.getElementById('goalDate');
    const nameEl = document.getElementById('eventName');
    const timeEl = document.getElementById('goalTime');
    const nextBtn = document.getElementById('next');
    function check(){ nextBtn.disabled = !(dateEl.value && nameEl.value.trim() && timeEl.value); }
    dateEl.addEventListener('input', check);
    nameEl.addEventListener('input', check);
    timeEl.addEventListener('input', check);
    check();
    document.getElementById('back').addEventListener('click', ()=>{ state.screen='home'; render(); });
    nextBtn.addEventListener('click', ()=>{
      state.goalDate = dateEl.value;
      state.eventName = nameEl.value.trim();
      state.goalTime = timeEl.value;
      state.screen = 'p-prep';
      render();
    });
  }

  // --- Shared: minute stepper (1-minute precision, direct typing) ---
  const stepperConfig = {
    prep:   { key:'prepMin',   label:'家を出るまでの「準備」に何分かかりますか？', hint:'着替え・身支度・朝食など、玄関を出るまでの時間', min:0, max:180 },
    travel: { key:'travelMin', label:'そこまでの「移動」に何分かかりますか？',       hint:'徒歩・電車・車など、実際にかかる移動時間', min:0, max:240 },
    buffer: { key:'bufferMin', label:'念のための「予備時間」はどれくらい取りますか？', hint:'忘れ物チェックや遅延対策など、あると安心な余裕時間', min:0, max:60 },
  };

  function renderStepper(cfg, backScreen, nextScreen){
    wizard.innerHTML = `
      <div class="card">
        <div class="q-label">${cfg.label}</div>
        <div class="q-hint">${cfg.hint}</div>
        <div class="stepper">
          <div class="stepper-row">
            <button id="dec">−1</button>
            <input type="number" class="min-input" id="val" value="${state[cfg.key]}" min="${cfg.min}" max="${cfg.max}" step="1">
            <button id="inc">＋1</button>
          </div>
          <div class="stepper-caption">1分単位で直接入力もできます</div>
        </div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="back">戻る</button>
          <button class="btn btn-primary" id="next">次へ</button>
        </div>
      </div>
    `;
    const valEl = document.getElementById('val');
    function setVal(v){
      v = Math.min(cfg.max, Math.max(cfg.min, Math.round(v) || 0));
      state[cfg.key] = v;
      valEl.value = v;
    }
    document.getElementById('dec').addEventListener('click', ()=>setVal(state[cfg.key]-1));
    document.getElementById('inc').addEventListener('click', ()=>setVal(state[cfg.key]+1));
    valEl.addEventListener('input', ()=>{ if(valEl.value !== '') state[cfg.key] = Number(valEl.value); });
    valEl.addEventListener('blur', ()=>setVal(valEl.value));
    document.getElementById('back').addEventListener('click', ()=>{ setVal(valEl.value); state.screen = backScreen; render(); });
    document.getElementById('next').addEventListener('click', ()=>{
      setVal(valEl.value);
      state.screen = nextScreen;
      if(nextScreen === 'p-result'){
        state.doneFlags = [false,false,false];
        state.alerted = new Set();
        savePlan({
          eventName: state.eventName,
          goalDate: state.goalDate,
          goalTime: state.goalTime,
          prepMin: state.prepMin,
          travelMin: state.travelMin,
          bufferMin: state.bufferMin,
        });
      }
      if((nextScreen === 'p-result' || nextScreen === 's-result') && state.bgmUrl) playBGM();
      render();
    });
  }

  // --- Shared board renderer ---
  function buildRows(eventName, goalTime){
    const goalMin = toMinutes(goalTime);
    const departMin = goalMin - state.travelMin;
    const prepStartMin = departMin - state.prepMin - state.bufferMin;
    return [
      { time: prepStartMin, label:'準備スタート', sub:`予備${state.bufferMin}分を含む` },
      { time: departMin,    label:'家を出る',      sub:`移動${state.travelMin}分` },
      { time: goalMin,      label: eventName,      sub:'目標達成' },
    ];
  }

  function renderPracticeResult(){
    const rows = buildRows(state.eventName, state.goalTime);
    const isToday = (state.goalDate === todayStr());
    const nowMin = nowMinutes();
    if(isToday){
      rows.forEach((r,i)=>{
        if(!state.doneFlags[i] && r.time <= nowMin && !state.alerted.has(i)){
          state.alerted.add(i); playAlert(); mascotSayCat('nudgeOverdue');
        }
      });
    }
    let nextAssigned = false;
    const rowsHtml = rows.map((r,i)=>{
      const done = state.doneFlags[i];
      let cls = 'row', flag = '';
      if(done){ cls += ' manual-done'; flag = '✓ 完了'; }
      else if(isToday && r.time <= nowMin){ cls += ' overdue'; flag = '時刻超過'; }
      else if(!nextAssigned){ cls += ' next'; flag = '次はこれ'; nextAssigned = true; }
      else { flag = 'この後'; }
      return `<div class="${cls}">
          <button class="check-btn ${done?'checked':''}" data-idx="${i}">${done?'✓':''}</button>
          <div class="time">${toHHMM(r.time)}</div>
          <div class="label">${r.label}<span class="sub">${r.sub}</span></div>
        </div>`;
    }).join('');

    const dateLabel = (() => {
      const [y,m,d] = state.goalDate.split('-').map(Number);
      return `${m}月${d}日`;
    })();

    wizard.innerHTML = `
      ${!isToday ? `<div class="q-hint" style="margin-bottom:10px;">📌 この計画は ${dateLabel} 用に保存されています。当日になると現在時刻と連動します。</div>` : ''}
      <div class="board">
        <div class="board-head">
          <div class="title">逆算スケジュール</div>
          <div class="now-wrap">
            <div class="now">${isToday ? '現在 ' + toHHMM(nowMin) : dateLabel}</div>
            ${state.bgmUrl ? `<button class="sound-toggle ${state.bgmPlaying?'':'off'}" id="bgmBtn">${state.bgmPlaying?'🎵':'🔈'}</button>` : ''}
            <button class="sound-toggle ${state.soundOn?'':'off'}" id="soundBtn">${state.soundOn?'🔊':'🔇'}</button>
          </div>
        </div>
        ${rowsHtml}
        <div class="board-foot">「${state.eventName}」に ${state.goalTime} までに間に合わせるには、上から順に◯ボタンを押しながら進めます。</div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost" id="editBtn">条件を変える</button>
        <button class="btn btn-primary" id="restartBtn">別の予定でもう一度</button>
      </div>
    `;
    document.getElementById('soundBtn').addEventListener('click', ()=>{ state.soundOn = !state.soundOn; renderPracticeResult(); });
    if(state.bgmUrl){ document.getElementById('bgmBtn').addEventListener('click', ()=>{ state.bgmPlaying ? pauseBGM() : playBGM(); renderPracticeResult(); }); }
    document.querySelectorAll('.check-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        state.doneFlags[idx] = !state.doneFlags[idx];
        if(state.doneFlags[idx]){
          playComplete();
          if(state.doneFlags.every(Boolean)){
            grantDecoration().then(d=>{
              const extra = d ? `<br>🎁「${d.name}」をゲット！部屋に飾ろう。` : '';
              mascotSay(pickLine('allDone') + extra, {celebrate:true});
            });
            clearSavedPlan();
          } else {
            mascotSay(pickLine(rows[idx].time > nowMinutes() ? 'praiseOnTime' : 'praiseOnTime'), {celebrate:true});
          }
        }
        renderPracticeResult();
      });
    });
    document.getElementById('editBtn').addEventListener('click', ()=>{ state.screen='p-prep'; render(); });
    document.getElementById('restartBtn').addEventListener('click', ()=>{
      stopBGM();
      clearSavedPlan();
      state.eventName=''; state.goalTime=''; state.goalDate='';
      state.doneFlags=[false,false,false]; state.alerted=new Set();
      state.screen='p-goal'; render();
    });
  }

  // --- Simulation scenarios ---
  const scenarioTemplates = [
    { tag:'待ち合わせ', friendNeeded:true,  make:(name)=>`${name}とカフェで待ち合わせ` },
    { tag:'待ち合わせ', friendNeeded:true,  make:(name)=>`${name}と映画を観に行く約束` },
    { tag:'お迎え',    friendNeeded:true,  make:(name)=>`${name}の子どもを一緒にお迎え` },
    { tag:'仕事',      friendNeeded:false, make:()=>`取引先とのオンライン会議` },
    { tag:'仕事',      friendNeeded:false, make:()=>`園内の職員会議` },
    { tag:'通院',      friendNeeded:false, make:()=>`歯医者の予約` },
    { tag:'習い事',    friendNeeded:false, make:()=>`ヨガ教室のレッスン開始` },
    { tag:'来客',      friendNeeded:true,  make:(name)=>`${name}が家に遊びに来る` },
    { tag:'移動',      friendNeeded:false, make:()=>`新幹線の発車時刻` },
  ];
  function randomTime(){
    const hour = 7 + Math.floor(Math.random()*15); // 7:00-21:xx
    const minutes = [0,10,15,20,30,40,45,50];
    const min = minutes[Math.floor(Math.random()*minutes.length)];
    return `${hour.toString().padStart(2,'0')}:${min.toString().padStart(2,'0')}`;
  }
  function generateScenario(){
    let pool = scenarioTemplates;
    if(state.friends.length === 0) pool = pool.filter(t => !t.friendNeeded);
    const t = pool[Math.floor(Math.random()*pool.length)];
    const name = t.friendNeeded ? state.friends[Math.floor(Math.random()*state.friends.length)] : null;
    state.sim = { eventName: t.make(name), goalTime: randomTime(), tag: t.tag };
    state.doneFlags = [false,false,false];
    state.solvedCount++;
    saveSolvedCount();
  }

  function renderScenario(){
    if(!state.sim) generateScenario();
    wizard.innerHTML = `
      <div class="card">
        <div class="scenario-tag">${state.sim.tag}</div>
        <div class="scenario-text">${state.sim.eventName}</div>
        <div class="scenario-time">${state.sim.goalTime}</div>
        <div class="q-hint" style="margin-top:8px;">この時刻に間に合うよう、逆算してみましょう。</div>
        <div class="solved-count">これまでに挑戦したお題：${state.solvedCount}問</div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="back">ホームに戻る</button>
          <button class="btn btn-primary" id="start">はじめる</button>
        </div>
      </div>
    `;
    document.getElementById('back').addEventListener('click', ()=>{ state.screen='home'; render(); });
    document.getElementById('start').addEventListener('click', ()=>{ state.screen='s-prep'; render(); });
  }

  function renderSimResult(){
    const rows = buildRows(state.sim.eventName, state.sim.goalTime);
    let nextAssigned = false;
    const rowsHtml = rows.map((r,i)=>{
      const done = state.doneFlags[i];
      let cls = 'row', flag = '';
      if(done){ cls += ' manual-done'; flag = '✓ 完了'; }
      else if(!nextAssigned){ cls += ' next'; flag = '次はこれ'; nextAssigned = true; }
      else { flag = 'この後'; }
      return `<div class="${cls}">
          <button class="check-btn ${done?'checked':''}" data-idx="${i}">${done?'✓':''}</button>
          <div class="time">${toHHMM(r.time)}</div>
          <div class="label">${r.label}<span class="sub">${r.sub}</span></div>
        </div>`;
    }).join('');

    wizard.innerHTML = `
      <div class="board">
        <div class="board-head">
          <div class="title">シミュレーション結果</div>
          <div class="now-wrap">
            ${state.bgmUrl ? `<button class="sound-toggle ${state.bgmPlaying?'':'off'}" id="bgmBtn">${state.bgmPlaying?'🎵':'🔈'}</button>` : ''}
            <button class="sound-toggle ${state.soundOn?'':'off'}" id="soundBtn">${state.soundOn?'🔊':'🔇'}</button>
          </div>
        </div>
        ${rowsHtml}
        <div class="board-foot">「${state.sim.eventName}」（${state.sim.goalTime}）に間に合わせるなら、この順番で動くのが正解です。</div>
      </div>
      <div class="result-actions">
        <button class="btn btn-ghost" id="homeBtn">ホームに戻る</button>
        <button class="btn btn-primary" id="nextBtn">次のお題へ</button>
      </div>
    `;
    document.getElementById('soundBtn').addEventListener('click', ()=>{ state.soundOn=!state.soundOn; renderSimResult(); });
    if(state.bgmUrl){ document.getElementById('bgmBtn').addEventListener('click', ()=>{ state.bgmPlaying ? pauseBGM() : playBGM(); renderSimResult(); }); }
    document.querySelectorAll('.check-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.dataset.idx);
        state.doneFlags[idx] = !state.doneFlags[idx];
        if(state.doneFlags[idx]){
          playComplete();
          if(state.doneFlags.every(Boolean)){
            setTimeout(playWin, 300);
            grantDecoration().then(d=>{
              const extra = d ? `<br>🎁「${d.name}」をゲット！部屋に飾ろう。` : '';
              mascotSay(pickLine('simWin') + extra, {celebrate:true});
            });
          } else {
            mascotSay(pickLine('praiseOnTime'), {celebrate:true});
          }
        }
        renderSimResult();
      });
    });
    document.getElementById('homeBtn').addEventListener('click', ()=>{ stopBGM(); state.screen='home'; render(); });
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      state.sim = null; state.screen='s-scenario'; render();
    });
  }

  loadPersisted().then(greetOnLoad);

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
